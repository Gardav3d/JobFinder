name: Check EDJOIN Jobs

on:
  schedule:
    - cron: "0 */2 * * *"

  workflow_dispatch:

concurrency:
  group: edjoin-job-finder
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # ------------------------------------------------------
      # MAKE SURE WE START FROM THE LATEST MAIN
      # ------------------------------------------------------
      - name: Sync with latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      # ------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ------------------------------------------------------
      # DEPENDENCIES
      # ------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # ------------------------------------------------------
      # RUN BOT
      # ------------------------------------------------------
      - name: Run EDJOIN scraper
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python bot.py

      # ------------------------------------------------------
      # COMMIT seen_jobs.json
      # ------------------------------------------------------
      - name: Commit updated seen jobs
        id: commit
        run: |
          git config user.name "edjoin-bot"
          git config user.email "edjoin-bot@users.noreply.github.com"

          git add seen_jobs.json

          if git diff --cached --quiet; then
            echo "No changes to seen_jobs.json"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Update seen jobs"

          echo "changed=true" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------
      # PUSH WITH RETRIES
      # ------------------------------------------------------
      - name: Push updated seen jobs
        if: steps.commit.outputs.changed == 'true'
        run: |
          MAX_RETRIES=5

          for ATTEMPT in $(seq 1 $MAX_RETRIES); do

            echo "Push attempt $ATTEMPT of $MAX_RETRIES"

            # Get anything that arrived on main while this
            # workflow was running.
            git fetch origin main

            # Put our commit on top of the newest main.
            if ! git rebase origin/main; then
              echo "Rebase failed."
              git rebase --abort
              exit 1
            fi

            # Attempt push.
            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            echo "Remote changed before push completed."
            echo "Fetching latest main and trying again..."

            sleep 2
          done

          echo "ERROR: Could not push after $MAX_RETRIES attempts."
          exit 1
