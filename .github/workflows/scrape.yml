name: Check EDJOIN Jobs

on:
  schedule:
    - cron: "0 */2 * * *"

  workflow_dispatch:

concurrency:
  group: edjoin-job-finder
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run EDJOIN scraper
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python bot.py

      - name: Check whether seen_jobs.json changed
        id: changes
        run: |
          if git diff --quiet -- seen_jobs.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change to seen_jobs.json"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "seen_jobs.json changed"
          fi

      - name: Save seen_jobs.json through GitHub API
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e

          echo "Reading current seen_jobs.json SHA from GitHub..."

          SHA=$(gh api \
            "repos/${GITHUB_REPOSITORY}/contents/seen_jobs.json?ref=main" \
            --jq '.sha')

          echo "Encoding new seen_jobs.json..."

          CONTENT=$(base64 -w 0 seen_jobs.json)

          echo "Updating seen_jobs.json directly..."

          gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/contents/seen_jobs.json" \
            -f message="Update seen jobs" \
            -f content="$CONTENT" \
            -f sha="$SHA" \
            -f branch="main"

          echo "seen_jobs.json successfully updated."
