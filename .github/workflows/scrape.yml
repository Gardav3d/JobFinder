name: Check EDJOIN Jobs

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

concurrency:
  group: edjoin-job-finder
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run EDJOIN scraper
        run: python bot.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Save updated job history
        run: |
          git config --global user.name "edjoin-bot"
          git config --global user.email "edjoin-bot@users.noreply.github.com"

          git add seen_jobs.json

          if git diff --cached --quiet; then
            echo "No new jobs to save."
            exit 0
          fi

          git commit -m "Update seen jobs"

          git pull --rebase origin main

          git push origin HEAD:main
